<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171c18" />
    <meta name="description" content="Total War: Warhammer III 개인 위키와 전술 메모" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>전쟁 서고 · WH3 개인 위키</title>
    <script>
      var route = new URLSearchParams(location.search).get('__vault_route');
      if (route !== null) {
        var base = '%BASE_URL%';
        var restored = new URL(base + route, location.origin);
        if (restored.origin === location.origin && restored.pathname.startsWith(base)) {
          history.replaceState(null, '', restored.pathname + restored.search + restored.hash);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
